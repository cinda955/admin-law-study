// 用户答案数组
var userAnswers = new Array(questions.length).fill(-1);

// 渲染所有题目
function renderQuestions() {
    var container = document.getElementById('questionsContainer');
    var html = '';
    for (var i = 0; i < questions.length; i++) {
        var q = questions[i];
        html += '<div class="question-card" data-qid="' + i + '">';
        html += '<div class="question-text"><span class="q-num">' + q.id + '.</span> ' + q.text + '</div>';
        html += '<div class="options">';
        html += '<button class="opt-btn opt-yes" onclick="selectAnswer(' + i + ', 1, this)">是</button>';
        html += '<button class="opt-btn opt-no"  onclick="selectAnswer(' + i + ', 0, this)">否</button>';
        html += '</div></div>';
    }
    container.innerHTML = html;
    document.getElementById('totalQuestions').textContent = questions.length;
}

// 选择答案
function selectAnswer(qIndex, value, btn) {
    userAnswers[qIndex] = value;
    var card = btn.closest('.question-card');
    var yesBtn = card.querySelector('.opt-yes');
    var noBtn = card.querySelector('.opt-no');
    yesBtn.classList.remove('selected-yes');
    noBtn.classList.remove('selected-no');
    if (value === 1) {
        yesBtn.classList.add('selected-yes');
    } else {
        noBtn.classList.add('selected-no');
    }
    updateProgress();
}

// 更新进度条
function updateProgress() {
    var answered = 0;
    for (var i = 0; i < userAnswers.length; i++) {
        if (userAnswers[i] !== -1) answered++;
    }
    document.getElementById('answeredCount').textContent = answered;
    var percent = (answered / questions.length) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
}

// 一键随机填答
document.getElementById('randomFillBtn').addEventListener('click', function() {
    for (var i = 0; i < questions.length; i++) {
        var randomVal = Math.random() < 0.5 ? 0 : 1;
        var card = document.querySelector('[data-qid="' + i + '"]');
        if (!card) continue;
        var btn = randomVal === 1 ? card.querySelector('.opt-yes') : card.querySelector('.opt-no');
        selectAnswer(i, randomVal, btn);
    }
    updateProgress();
    alert('已随机生成所有答案！可点击“提交分析”查看结果。');
});

        },
        'depression': {
            high: '您可能存在情绪低落、兴趣减退、自我否定等倾向，建议关注心理健康，必要时寻求专业支持。',
            mid: '您有时可能感到情绪不佳或动力不足，可尝试增加积极活动和社交互动。',
            low: '您情绪状态良好，对生活保持积极态度，拥有较好的心理弹性。'
        },
        'somatic': {
            high: '您对身体信号高度敏感，常感到各种不适，但可能并非器质性问题，注意身心平衡，学习放松。',
            mid: '您对身体变化有一定关注，适度注意即可，不必过度担忧影响到生活。',
            low: '您对身体状况不太敏感，整体感觉健康，较少受躯体不适困扰。'
        },
        'social': {
            high: '您在社交场合可能感到不自在，倾向于回避人际交往，可逐步尝试开放自己，从小范围社交开始。',
            mid: '您在社交中有时会感到拘束或紧张，但总体上能够应对日常交往，可练习社交技巧。',
            low: '您善于社交，与人相处轻松自然，能够自如地表达自己。'
        },
        'impulse': {
            high: '您有时难以控制冲动，易怒或行为反复，可练习自我觉察和冷静技巧，增强自控力。',
            mid: '您偶尔会表现出冲动行为，但基本在可控范围内，注意情绪管理即可。',
            low: '您自控能力较强，情绪和行为较为稳定，不易冲动行事。'
        },
        'health_anxiety': {
            high: '您对健康状况过度关注，可能频繁检查身体或担心患病，建议科学看待健康，避免过度焦虑。',
            mid: '您对健康有一定担忧，适度关注是正常的，但别让它占据太多精力。',
            low: '您对健康保持平常心，不会过度忧虑，具有良好的健康心态。'
        }
    };

    html += '<div style="margin-top:20px;">';
    for (var d = 0; d < dims.length; d++) {
        var dim = dims[d];
        var score = scores[dim];
        var max = maxScores[dim];
        var ratio = max > 0 ? (score / max) : 0;
        var level = ratio >= 0.7 ? '高风险' : (ratio >= 0.4 ? '中等' : '正常');
        var desc = ratio >= 0.7 ? dimDesc[dim].high : (ratio >= 0.4 ? dimDesc[dim].mid : dimDesc[dim].low);
        var barColor = ratio >= 0.7 ? '#e74c3c' : (ratio >= 0.4 ? '#f39c12' : '#27ae60');

        html += '<div style="margin-bottom:16px;">';
        html += '<div style="font-weight:700; margin-bottom:4px;">' + dimNames[dim] + '：' + level + '（得分率 ' + (ratio*100).toFixed(0) + '%）</div>';
        html += '<div style="height:8px; background:#e0dcd5; border-radius:4px; margin:4px 0;"><div style="height:100%; width:' + (ratio*100) + '%; background:' + barColor + '; border-radius:4px;"></div></div>';
        html += '<div style="font-size:0.9rem; color:#5c5347;">' + desc + '</div>';
        html += '</div>';
    }
    html += '</div>';

    var highCount = 0;
    for (var d2 = 0; d2 < dims.length; d2++) {
        var r = maxScores[dims[d2]] > 0 ? (scores[dims[d2]] / maxScores[dims[d2]]) : 0;
        if (r >= 0.7) highCount++;
    }
    html += '<div style="margin-top:20px; padding:14px; background:#eaf2f8; border-radius:8px;">';
    html += '<strong>💡 综合建议：</strong><br>';
    if (highCount >= 3) {
        html += '您的多个心理维度得分较高，提示当前可能处于较高压力水平，建议您关注自身心理健康，必要时可寻求专业心理咨询或评估。';
    } else if (highCount >= 1) {
        html += '您在部分维度上得分偏高，可针对相应方面进行调整，保持良好生活习惯，适当减压。';
    } else {
        html += '您目前心理状态整体良好，请继续保持积极乐观的生活态度。';
    }
    html += '</div>';
    html += '<div style="text-align:right; font-size:0.85rem; color:#5c5347; margin-top:12px;">⏱ 提交用时：' + timeTaken + ' 秒</div>';

    var resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = html;
    resultArea.style.display = 'block';
    window.scrollTo({ top: resultArea.offsetTop - 20, behavior: 'smooth' });
});

// 初始化
renderQuestions();
updateProgress();
</script>
