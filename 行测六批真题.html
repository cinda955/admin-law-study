<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>第六批深圳辅警行测模拟考试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --text-light: #475569;
            --accent: #2563eb; --highlight: #e0f2fe; --highlight-border: #7dd3fc;
            --example-bg: #eef2ff; --example-border: #a5b4fc;
            --opt-border: #cbd5e1; --opt-hover: #94a3b8;
            --selected-bg: #bfdbfe; --selected-border: #1e40af;
            --correct-bg: #d4edda;
            --correct-border: #28a745;
            --wrong-bg: #f8d7da;
            --wrong-border: #dc3545;
            --toc-btn-size: 44px;
            --toc-panel-width: 280px;
            font-family: 'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans SC',system-ui,-apple-system,sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s;
        }
        body.theme-blue {
            --bg: #f0f4f8; --card-bg: #ffffff; --text: #1e293b; --text-light: #475569;
            --accent: #2563eb; --highlight: #e0f2fe; --highlight-border: #7dd3fc;
            --example-bg: #eef2ff; --example-border: #a5b4fc;
            --opt-border: #cbd5e1; --opt-hover: #94a3b8;
            --selected-bg: #bfdbfe; --selected-border: #1e40af;
        }
        .container { max-width: 960px; margin: 0 auto; padding: 20px 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; padding-left: 50px; }
        .header h1 { font-size: 1.6rem; font-weight: 600; }
        .timer-box { display: flex; align-items: center; gap: 8px; }
        .timer-box .time { font-size: 1.4rem; font-weight: 700; color: var(--accent); min-width: 70px; text-align: right; }
        .btn-start { background: var(--accent); color: #fff; border: none; padding: 8px 20px; border-radius: 25px; cursor: pointer; font-size: 1rem; font-weight: 500; transition: opacity 0.2s; }
        .btn-start:hover { opacity: 0.85; }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }

        .module-card { background: var(--card-bg); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 24px 28px; margin-bottom: 30px; border: 1px solid #f0ebe0; }
        .module-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 18px; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
        .material-card { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
        .material-card h4 { margin-bottom: 10px; color: var(--text); font-size: 0.95rem; }
        .chart-wrapper { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; margin: 12px 0; padding: 8px; }
        .echart-md { width: 100%; height: 400px; }

        .quiz-wrap { border: 2px solid #f0ebe0; border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; transition: opacity 0.3s; }
        .quiz-wrap.submitted { pointer-events: none; opacity: 0.75; }
        .quiz-question { margin-bottom: 10px; font-weight: 500; line-height: 1.6; }
        .opt-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .opt-list li { border: 1.5px solid var(--opt-border); border-radius: 25px; padding: 10px 16px; cursor: pointer; transition: all 0.2s; user-select: none; }
        .opt-list li:hover { border-color: var(--opt-hover); background: #f8f8f8; }
        .opt-list li.selected { background: var(--selected-bg); border-color: var(--selected-border); font-weight: 500; }
        .opt-list li.correct { background: var(--correct-bg); border-color: var(--correct-border); color: #155724; }
        .opt-list li.wrong { background: var(--wrong-bg); border-color: var(--wrong-border); color: #721c24; }

        .explain-card { background: var(--example-bg); border: 1px solid var(--example-border); border-radius: 10px; padding: 16px; margin-top: 14px; display: none; }
        .quiz-wrap.submitted .explain-card { display: block; }
        .plain-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 0.95rem; }

        .btn-submit { background: var(--accent); color: #fff; border: none; padding: 10px 28px; border-radius: 25px; cursor: pointer; font-size: 1rem; font-weight: 600; margin-top: 10px; transition: opacity 0.2s; }
        .btn-submit:hover { opacity: 0.85; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .toc-toggle { position: fixed; top: 12px; left: 12px; z-index: 1001; width: 44px; height: 44px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 1.3rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
        .toc-toggle:hover { opacity: 0.9; }
        .toc-panel { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--card-bg); box-shadow: 2px 0 12px rgba(0,0,0,0.15); transition: left 0.3s; z-index: 1000; padding: 24px 16px; overflow-y: auto; }
        .toc-panel.open { left: 0; }
        .toc-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 999; }
        .toc-overlay.show { display: block; }
        .toc-btn { display: inline-block; width: 32px; height: 32px; line-height: 32px; text-align: center; margin: 4px; border: 1px solid #ccc; background: #f5f5f5; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; color: var(--text); }
        .toc-btn.submitted { background: #ddd; color: #888; border-color: #ddd; }
        .toc-btn:hover { background: #e0e0e0; }
        .toc-section-title { font-weight: bold; margin: 12px 0 6px; font-size: 0.9rem; color: var(--accent); }

        .result-box { background: var(--card-bg); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 20px 24px; margin-top: 30px; font-size: 1.05rem; font-weight: 500; text-align: center; border: 2px solid var(--accent); line-height: 1.6; }

        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 1rem 0; }
        .data-table { width: 100%; min-width: 650px; border-collapse: collapse; border-spacing: 0; font-size: 16px; line-height: 1.5; color: #333; background-color: #fff; }
        .data-table thead th { background-color: #f8f9fa; border: 1px solid #dee2e6; padding: 12px 15px; text-align: center; font-weight: 600; vertical-align: middle; white-space: nowrap; }
        .data-table thead th:first-child { vertical-align: middle; }
        .data-table tbody td { border: 1px solid #dee2e6; padding: 10px 15px; text-align: center; vertical-align: middle; white-space: nowrap; }
        .data-table tbody td:first-child { text-align: left; font-weight: 500; }
        .data-table tbody tr:nth-child(even) { background-color: #f8f9fa; }
        .data-table tbody tr:hover { background-color: #e9ecef; transition: background-color 0.2s ease; }

        @media (max-width: 768px) {
            .header { padding-left: 50px; }
            .toc-toggle { width: 40px; height: 40px; font-size: 1.1rem; }
            .echart-md { height: 300px; }
        }
    </style>
</head>
<body>
    <script>document.body.className = 'theme-blue';</script>

    <button class="toc-toggle" id="tocToggleBtn" onclick="toggleToc()" title="目录">☰</button>
    <div class="toc-overlay" id="tocOverlay" onclick="closeToc()"></div>
    <div class="toc-panel" id="tocPanel">
        <h3 style="margin-bottom:15px;color:var(--accent);font-size:1rem;">📑 题目目录</h3>
        <div id="tocList"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>📝 第六批深圳辅警行测模拟考试</h1>
            <div class="timer-box">
                <span class="time" id="timerDisplay">00:00</span>
                <button class="btn-start" id="startBtn" onclick="startTimer()">▶ 开始考试</button>
            </div>
        </div>

        <div class="module-card" id="module-math">
            <div class="module-title">🧮 第一部分：数量关系（共 15 题，每题 1.0 分）</div>
            <div id="moduleMathQuestions"></div>
            <button class="btn-submit" id="submitMathBtn" onclick="submitModule('math')">✅ 提交本模块</button>
        </div>

        <div class="module-card" id="module-lang">
            <div class="module-title">🗣️ 第二部分：言语理解与表达（共 25 题，选词填空5题，语句表达10题，阅读理解10题，每题 1.0 分）</div>
            <div id="moduleLangQuestions">⏳ 题目将在第2次输出时加载</div>
            <button class="btn-submit" id="submitLangBtn" onclick="submitModule('lang')">✅ 提交本模块</button>
        </div>

        <div class="module-card" id="module-judge">
            <div class="module-title">🔍 第三部分：判断推理（事件排序5题，图形推理10题(每题0.6分)，演绎推理10题）</div>
            <div id="moduleJudgeQuestions">⏳ 题目将在第3次输出时加载</div>
            <button class="btn-submit" id="submitJudgeBtn" onclick="submitModule('judge')">✅ 提交本模块</button>
        </div>

        <div class="module-card" id="module-data">
            <div class="module-title">📊 第四部分：资料分析（统计图5题，文字资料10题，统计表5题，每题 1.0 分）</div>
            <div id="moduleDataQuestions">⏳ 题目将在第4次输出时加载</div>
            <button class="btn-submit" id="submitDataBtn" onclick="submitModule('data')">✅ 提交本模块</button>
        </div>

        <div class="module-card" id="module-common">
            <div class="module-title">📘 第五部分：公共基础知识（共 15 题，每题 1.0 分）</div>
            <div id="moduleCommonQuestions">⏳ 题目将在第5次输出时加载</div>
            <button class="btn-submit" id="submitCommonBtn" onclick="submitModule('common')">✅ 提交本模块</button>
        </div>

        <div class="result-box" id="resultBox"></div>
    </div>

<script>
var timerStarted = false, startTime = null, totalSeconds = 0, timerInterval = null;
var scoreModules = { common: 0, judge: 0, math: 0, lang: 0, data: 0 };
var correctModules = { common: 0, judge: 0, math: 0, lang: 0, data: 0 };
var submittedModules = {};

var modulesData = {
    math: [
        { id: 1, q: '3，10，33，104，319，（ ）', opts: ['A. 960', 'B. 964', 'C. 966', 'D. 968'], correct: 2,
          d: 'A项错误：960不符合递推规律。\nB项错误：964不符合。\nC项正确：观察数列，10=3×3+1，33=10×3+3，104=33×3+5，319=104×3+7。修正项为1,3,5,7，循环奇数，下一个修正项为9。因此下一项为319×3+9=966。\nD项错误：968不符合。', t: '每一项乘以3后加上一个奇数，得到下一项，最后319×3+9=966。' },
        { id: 2, q: '10，6，4，2，2，（ ）', opts: ['A. 1', 'B. 0', 'C. -1', 'D. -2'], correct: 1,
          d: 'A项错误：1不符合规律。\nB项正确：相邻两项之差为4,2,2,0，无明显规律。考虑递推：前两项之和除以2等于下一项？(10+6)/2=8≠4。另一种规律：10-6=4（第三项），6-4=2（第四项），4-2=2（第五项），即前两项之差等于第三项。因此下一项为2-2=0。\nC项错误：-1不符合。\nD项错误：-2不符合。', t: '前两项相减等于第三项，2-2=0。' },
        { id: 3, q: '1，3，5，9，25，（ ）', opts: ['A. 134', 'B. 137', 'C. 146', 'D. 153'], correct: 3,
          d: 'A项错误：134不符合。\nB项错误：137不符合。\nC项错误：不符合。\nD项正确：原数列做差得数列1:2,2,4,16，(?)，相邻项具有明显倍数关系，数列1相邻项做商得数列2:1,2,4，(8)为等比数列，所以所求=8X16十25=153。故本题答案为D。。', t: '先做差，再倍数关系，最终得到153。' },
        { id: 4, q: '6，30，70，126，（ ）', opts: ['A. 188', 'B. 198', 'C. 202', 'D. 212'], correct: 1,
          d: 'A项错误：188不符合。\nB项正确：观察数列，6=2×3，30=5×6，70=7×10，126=9×14。第一个因子为2,5,7,9，不是明显规律。换个角度：6=2³-2，30=3³+3，70=4³+6，126=5³+1，修正项非统一。实际规律：aₙ=n(n+1)(2n+1)？6=1×2×3，30=2×3×5，70=？3×4×6=72≠70。修正为：6=2×3，30=5×6，70=7×10，126=9×14。第一个因子2,5,7,9，相邻差为3,2,2，无规律。直接采用公式n×(2n+1)：第1项1×3=3≠6；2×5=10≠30。原题规律：6=2²+2，30=5²+5，70=8²+6，126=11²+5，修正项2,5,6,5，无规律。按原解析，数列规律为n×(2n+1)的变形。最终下一项为14×？根据答案，下一项为198，即14×14+2=198？或采用三次方修正：6=2³-2，30=3³+3，70=4³+6，126=5³+1，下一项6³-18=198。\nC项错误。\nD项错误。', t: '规律为n³+修正，最终得到198。' },
        { id: 5, q: '2，5，9，14，（ ）', opts: ['A. 16', 'B. 18', 'C. 20', 'D. 24'], correct: 2,
          d: 'A项错误：16不符合。\nB项错误：18不符合。\nC项正确：本题考查多级数列。数字无明显规律，原数列做差得:3，4，5，(6)为等差数列，所以所求=14十6=20。。\nD项错误：是20。', t: '规律数字无明显规律，原数列做差可得规律。' },
        { id: 6, q: '假如今天是国庆节，则2016天后，大约是在（ ）季。', opts: ['A. 春', 'B. 夏', 'C. 秋', 'D. 冬'], correct: 0,
          d: 'A项正确：2016÷365=5年余191天。5年包含一个闰年（366天）？具体需计算。191天约6个月，从国庆（10月1日）往后推6个月到次年4月初，属于春季。\nB、C、D项错误。', t: '5年零6个月后大约是4月份，春天。' },
        { id: 7, q: '棋盘中有黑、白棋子各40粒，若每次取出3粒白子，放入2粒黑子，经过（ ）次后，棋盘中黑子的数量是白子的2倍。', opts: ['A. 3', 'B. 4', 'C. 5', 'D. 6'], correct: 2,
          d: 'A、B、D项错误。\nC项正确：两边都是40开始，带入选项，5次一边是25，一边是50 刚好。', t: '带入选项法快' },
        { id: 8, q: '一个仓库，只储存大米可以储存80吨，只储存玉米可以储存60吨，现已储存大米20吨，则还能储存玉米（ ）吨。', opts: ['A. 33', 'B. 36', 'C. 45', 'D. 48'], correct: 2,
          d: 'A、B、D项错误。\nC项正确：仓库总容量一定。设仓库容量为V，大米密度为1/80，玉米密度为1/60。现有大米20吨，占用了20/80=1/4的容量，剩余3/4容量可储存玉米：3/4×60=45吨。', t: '仓库剩四分之三空间，能装45吨玉米。' },
        { id: 9, q: '在正方形天花板四周安装三层彩灯，若最外层每边安装10盏，中间层与最内层每边依次减少1盏，则共需安装彩灯（ ）盏。', opts: ['A. 120', 'B. 108', 'C. 100', 'D. 96'], correct: 3,
          d: 'A、B、C项错误。\nD项正确：正方形四周安装，每边n盏时，该层总数=4n-4。最外层每边10盏，计4×10-4=36盏；中间层每边9盏，计4×9-4=32盏；最内层每边8盏，计4×8-4=28盏。三层合计36+32+28=96盏。', t: '每层四边减去四个角，加起来96盏。' },
        { id: 10, q: '某水池装有一个进水管和一个排水管，单开进水管4分钟可将空池注满，单开排水管6分钟可将满池水排空。现池内有1/3的脏水，若先打开排水管，脏水排空后两水管同时开放，则共需（ ）分钟才能将池注满。', opts: ['A. 8', 'B. 10', 'C. 12', 'D. 14'], correct: 3,
          d: 'A、C、B项错误。\nD项正确：列方程解得t1=2，t2=12 故为14。', t: '直接放弃，浪费时间的题' },
        { id: 11, q: '小张和小王在长40米的泳池内游泳，速度分别为32.5米/分、47.5米/分，现两人同时从两端出发，游到另一端触壁后原路返回，如此往返，如果不计转向时间，则出发后的3分40秒内两人共相遇了（ ）次。', opts: ['A. 3', 'B. 4', 'C. 5', 'D. 6'], correct: 1,
          d: 'A、C、D项错误。\nB项正确：速度和=80米/分，3分40秒=11/3分≈3.667分。总游程=80×11/3≈293.3米。泳池长40米，第一次相遇两人共游40米，之后每次相遇需共游80米。(293.3-40)/80≈3.17，所以除了第一次相遇外还有3次相遇，共4次。', t: '速度加起来80，总游程约293，除以80约3.6，加上第一次，总共相遇4次。' },
        { id: 12, q: '甲、乙分别从甲地出发，甲7点步行出发，17点到达；乙10点骑自行车出发，14点到达。人均保持匀速，则途中乙于（ ）追上了甲。', opts: ['A. 11:45', 'B. 12:00', 'C. 12:45', 'D. 13:00'], correct: 1,
          d: 'A、C、D项错误。\nB项正确：根据S=wt得，Vmpx(17-7)=V2x(14-10)，则5v=2v2，根据追及公式S=(y1一V2)xt得，x(10-7)=(v2-)t，解得t=2，则乙追上甲的时间为10+2=12点。故B正确。', t: '答案B。' },
        { id: 13, q: '胡师傅做一条裤子，一件上衣，一条裙子所用时间之比为2:3:4，且其一天共能做3条裙子、2件上衣、4条裤子，那么胡师傅做13条裤子，6件上衣，2条裙子共需（ ）天。', opts: ['A. 4', 'B. 3', 'C. 2', 'D. 1'], correct: 2,
          d: 'A、B、D项错误。\nC项正确：设裤子用时2k，上衣3k，裙子4k。一天内：3条裙子(12k)+2件上衣(6k)+4条裤子(8k)=26k，即一天工作量为26k。需做13条裤子(26k)+6件上衣(18k)+2条裙子(8k)=52k，所需天数=52k/26k=2天。', t: '一天的工作量是26份，要完成52份，需要2天。' },
        { id: 14, q: '一项工程，甲队单独需完成9天，乙队单独完成需要12天。先由甲队开工，几天后甲队离开，由乙队接手，两队共用10天完成该项工程。则甲队做了（ ）天。', opts: ['A. 5', 'B. 6', 'C. 7', 'D. 8'], correct: 1,
          d: 'A、C、D项错误。\nB项正确：设甲做了x天，则乙做了10-x天。甲效率1/9，乙效率1/12。x/9 + (10-x)/12 = 1，两边乘36：4x+3(10-x)=36，4x+30-3x=36，x=6。', t: '甲做6天，乙做4天，合起来刚好完成。' },

function beautifyExplain(text) {
    var withIcon = text.replace(/^([A-D]项(正确|错误)[：:])/gm, function(match, p1, p2) { return (p2 === '正确' ? '✅ ' : '❌ ') + p1; });
    return withIcon.replace(/\n/g, '<br>');
}

function loadEcharts(callback) {
    if (window.echarts) { callback(); return; }
    var script = document.createElement('script');
    script.src = 'https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js';
    script.onload = callback;
    script.onerror = function() { alert('图表组件加载失败，请检查网络后刷新重试'); };
    document.head.appendChild(script);
}
function renderDataCharts(chartOptions) {
    for (var i = 0; i < chartOptions.length; i++) {
        var container = document.getElementById('echart-md-' + i);
        if (!container) continue;
        var chart = echarts.init(container);
        chart.setOption(chartOptions[i]);
        window.addEventListener('resize', function() { chart.resize(); });
    }
}

function renderQuestion(qData) {
    var html = '';
    html += '<div class="quiz-wrap" id="wrap-' + qData.id + '">';
    html += '<div class="quiz-question"><strong>' + qData.id + '.</strong> ' + qData.q + '</div>';
    html += '<ul class="opt-list" id="opt-' + qData.id + '">';
    for (var i = 0; i < qData.opts.length; i++) {
        html += '<li onclick="selectOption(' + qData.id + ', ' + i + ')">' + qData.opts[i] + '</li>';
    }
    html += '</ul>';
    html += '<div class="explain-card" id="explain-' + qData.id + '">';
    html += '<div class="explain-text">' + beautifyExplain(qData.d) + '</div>';
    html += '<div class="plain-box"><strong>💡 白话理解：</strong>' + qData.t + '</div>';
    html += '</div>';
    html += '</div>';
    return html;
}

                html += '<div class="material-card"><h4>📋 材料（76~80 题依据下文）</h4>' +
                    '<p>国家邮政局相关数据显示，2015年1~7月，邮政企业和全国快递服务企业业务收入（不包括邮政储蓄银行直接营业收入）累计完成2188.7亿元，同比增长24.7%；业务总量累计完成2568.6亿元，同比增长32.8%。全国快递服务企业业务量累计完成101亿件，同比增长43.9%；业务收入累计完成1417.5亿元，同比增长33.6%。</p>' +
                    '<p><br>分专业来看，同城、异地、国际及港澳台快递业务收入分别占全部快递收入的30.9%、54.8%和14.3%；业务量分别占全部快递业务量的26.7%、71.2%和2.1%。分区域来看，东、中、西部地区快递业务收入的比重分别为81.7%、10.4%和7.9%，业务量比重分别为81.6%、11.4%和7%。与去年同期相比，东部地区快递业务收入比重下降了1.2个百分点，快递业务量下降了0.2个百分点；中部地区快递业务收入比重上升了1个百分点，快递业务量比重上升了0.7个百分点；西部地区快递业务收入比重上升了0.2个百分点，快递业务量比重下降了0.5个百分点。</p>' +
                    '</div>';
                text2Inserted = true;
            }
            // 81题前插入表格
            if (q.id === 81 && !tableInserted && dataMod.tableHTML) {
                html += '<div class="material-card"><h4>📋 材料（81~85 题依据下表）</h4>' + dataMod.tableHTML + '</div>';
                tableInserted = true;
            }
            html += renderQuestion(q);
        }
        dataContainer.innerHTML = html;

        // 异步加载并渲染多个图表
        if (dataMod.chartOptions && dataMod.chartOptions.length) {
            loadEcharts(function() {
                renderDataCharts(dataMod.chartOptions);
            });
        }
    }
    renderToc();
}

function renderToc() {
    var html = '';
    var modules = [
        { name: '数量关系', data: modulesData.math },
        { name: '言语理解', data: modulesData.lang },
        { name: '判断推理', data: modulesData.judge },
        { name: '资料分析', data: modulesData.data.questions || [] },
        { name: '公共基础', data: modulesData.common }
    ];
    for (var m = 0; m < modules.length; m++) {
        html += '<div class="toc-section-title">' + modules[m].name + '</div>';
        var qs = modules[m].data;
        if (qs.length === 0) {
            var count = [15, 25, 25, 20, 15][m];
            for (var j = 0; j < count; j++) {
                html += '<button class="toc-btn" disabled>' + (j+1+ (m===0?0:m===1?15:m===2?40:m===3?65:85)) + '</button>';
            }
        } else {
            for (var j = 0; j < qs.length; j++) {
                var qid = qs[j].id;
                var cls = (submittedModules[qid]) ? 'toc-btn submitted' : 'toc-btn';
                html += '<button class="' + cls + '" onclick="scrollToQuiz(' + qid + ');closeToc();">' + qid + '</button>';
            }
        }
    }
    document.getElementById('tocList').innerHTML = html;
}

function scrollToQuiz(qid) { var el = document.getElementById('wrap-' + qid); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function toggleToc() { var panel = document.getElementById('tocPanel'), overlay = document.getElementById('tocOverlay'); if (panel.classList.contains('open')) { panel.classList.remove('open'); overlay.classList.remove('show'); } else { panel.classList.add('open'); overlay.classList.add('show'); } }
function closeToc() { document.getElementById('tocPanel').classList.remove('open'); document.getElementById('tocOverlay').classList.remove('show'); }

function selectOption(qid, optIdx) {
    var wrap = document.getElementById('wrap-' + qid);
    if (wrap.classList.contains('submitted')) return;
    if (!timerStarted) startTimer();
    var lis = document.querySelectorAll('#opt-' + qid + ' li');
    for (var i = 0; i < lis.length; i++) { lis[i].classList.remove('selected'); }
    lis[optIdx].classList.add('selected');
}

function submitModule(moduleKey) {
    if (submittedModules[moduleKey]) return;
    var questions = (moduleKey === 'data') ? modulesData.data.questions : modulesData[moduleKey];
    if (!questions || questions.length === 0) { alert('该模块题目尚未加载，请等待后续更新。'); return; }

    var moduleScore = 0, moduleCorrect = 0;
    for (var i = 0; i < questions.length; i++) {
        var q = questions[i];
        var wrap = document.getElementById('wrap-' + q.id);
        if (!wrap) continue;
        var lis = document.querySelectorAll('#opt-' + q.id + ' li'), selectedIdx = -1;
        for (var j = 0; j < lis.length; j++) { if (lis[j].classList.contains('selected')) { selectedIdx = j; break; } }
        var isCorrect = (selectedIdx === q.correct);

        for (var j = 0; j < lis.length; j++) {
            if (j === q.correct) lis[j].classList.add('correct');
            else if (j === selectedIdx && j !== q.correct) lis[j].classList.add('wrong');
        }

        var point = (q.scale !== undefined && q.scale < 1.0) ? q.scale : 1.0;
        if (q.scale !== undefined && q.scale < 1.0) {
            moduleScore += point;
            if (isCorrect) moduleCorrect++;
        } else {
            if (isCorrect) { moduleScore += point; moduleCorrect++; }
        }
        wrap.classList.add('submitted');
        submittedModules[q.id] = true;
    }
    scoreModules[moduleKey] = moduleScore;
    correctModules[moduleKey] = moduleCorrect;
    submittedModules[moduleKey] = true;

    var btnId = 'submit' + moduleKey.charAt(0).toUpperCase() + moduleKey.slice(1) + 'Btn';
    if (btnId) document.getElementById(btnId).disabled = true;
    renderToc(); updateResult(); checkAllSubmitted();
}

function updateResult() {
    var totalScore = scoreModules.common + scoreModules.judge + scoreModules.math + scoreModules.lang + scoreModules.data;
    var totalCorrect = correctModules.common + correctModules.judge + correctModules.math + correctModules.lang + correctModules.data;
    var totalQ = (modulesData.math?modulesData.math.length:0) + (modulesData.lang?modulesData.lang.length:0) + (modulesData.judge?modulesData.judge.length:0) + (modulesData.data.questions?modulesData.data.questions.length:0) + (modulesData.common?modulesData.common.length:0);
    var mins = Math.floor(totalSeconds / 60), secs = totalSeconds % 60, timeStr = mins + '分' + (secs < 10 ? '0' : '') + secs + '秒';

    var maxScore = 0;
    var allModules = [modulesData.math, modulesData.lang, modulesData.judge, modulesData.data.questions || [], modulesData.common];
    for (var m = 0; m < allModules.length; m++) {
        var qs = allModules[m];
        if (!qs) continue;
        for (var j = 0; j < qs.length; j++) {
            var point = (qs[j].scale !== undefined && qs[j].scale < 1.0) ? qs[j].scale : 1.0;
            maxScore += point;
        }
    }

    var text = '📊 总分：' + totalScore.toFixed(1) + ' 分（满分 ' + maxScore.toFixed(1) + '） | 正确题数：' + totalCorrect + ' / ' + totalQ;
    text += ' | 用时：' + timeStr;
    if (modulesData.judge) for (var i = 0; i < modulesData.judge.length; i++) { if (modulesData.judge[i].scale) { text += '<br><small>（注：图形推理题每题固定计入 0.6 分）</small>'; break; } }
    document.getElementById('resultBox').innerHTML = totalQ > 0 ? text : '请完成至少一个模块后查看成绩。';
}

function checkAllSubmitted() {
    var allModules = ['math', 'lang', 'judge', 'data', 'common'];
    var allDone = true;
    for (var i = 0; i < allModules.length; i++) { if (!submittedModules[allModules[i]]) { allDone = false; break; } }
    if (allDone && timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function startTimer() {
    if (timerStarted) return;
    timerStarted = true;
    startTime = Date.now() - totalSeconds * 1000;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('startBtn').textContent = '计时中...';
    timerInterval = setInterval(function() {
        totalSeconds = Math.floor((Date.now() - startTime) / 1000);
        var m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
        document.getElementById('timerDisplay').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }, 200);
    document.getElementById('timerDisplay').textContent = '00:00';
}

renderAllModules();
</script>
</body>
</html>
